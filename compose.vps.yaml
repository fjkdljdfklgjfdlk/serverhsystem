# Existing Nginx handles HTTPS. The API port is reachable only from the VPS.
services:
  api:
    build: .
    image: serverh-control:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /app/data/serverh.sqlite
      TRUST_PROXY: 1
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - panel-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  panel-data:
