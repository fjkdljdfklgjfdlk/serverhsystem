server {
    listen 80;
    listen [::]:80;
    server_name serverh.uhbacon.cloud;
    location /.well-known/acme-challenge/ { root /var/www/serverh-acme; }
    location / { return 301 https://serverh.uhbacon.cloud$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name serverh.uhbacon.cloud;
    ssl_certificate /etc/letsencrypt/live/serverh.uhbacon.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serverh.uhbacon.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ServerHSSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    client_body_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
